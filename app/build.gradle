plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yjw071218.sumdoku'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.yjw071218.sumdoku'
        minSdk 26
        targetSdk 35
        versionCode 119
        versionName '1.1.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero external dependencies needed
}
