plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 플레이 업로드 키: 저장소 밖에 보관합니다(커밋 금지).
// 기본 위치: %USERPROFILE%\.sumdoku-keys\keystore.properties
// 다른 위치를 쓰려면 gradle 실행 시 -Psumdoku.keystoreProps=경로
// ---------------------------------------------------------------------------
def keystorePropsFile = file(findProperty('sumdoku.keystoreProps') ?: "${System.getProperty('user.home')}/.sumdoku-keys/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

// AdMob ID: 실제 ID는 %USERPROFILE%\.gradle\gradle.properties 또는 -P 옵션으로 지정합니다.
// 지정하지 않으면 Google 공식 테스트 ID를 사용합니다(테스트 광고만 표시, 수익 없음).
def admobAppId = findProperty('sumdoku.admob.appId') ?: 'ca-app-pub-3940256099942544~3347511713'
def admobBannerId = findProperty('sumdoku.admob.bannerId') ?: 'ca-app-pub-3940256099942544/9214589741'
def admobInterstitialId = findProperty('sumdoku.admob.interstitialId') ?: 'ca-app-pub-3940256099942544/1033173712'
def admobRewardedId = findProperty('sumdoku.admob.rewardedId') ?: 'ca-app-pub-3940256099942544/5224354917'

def gamesId = (findProperty('sumdoku.games.appId') ?: '').toString()
// v1.1.19 Play 게임즈 리더보드 ID (Play Console에서 생성 후 gradle.properties 또는 -P 로 지정)
def lbKeys = ['rating','rating_easy','rating_medium','rating_hard','rating_expert','rating_lunatic','ta_rating','ta_rating_easy','ta_rating_medium','ta_rating_hard','ta_rating_expert','ta_rating_lunatic','easy','medium','hard','expert','lunatic','daily']
// v1.1.28: 시즌 리더보드(s1_rating_hard 등)처럼 목록에 없는 키도 gradle 속성에 있으면 함께 넣습니다.
lbKeys = (lbKeys + project.properties.keySet().findAll { it.toString().startsWith('sumdoku.games.lb.') }.collect { it.toString().substring(17) }).unique()
def leaderboards = lbKeys.collect { k -> def v = (findProperty("sumdoku.games.lb." + k) ?: '').toString(); if (v && !(v ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid leaderboard ID: ' + k); v ? k + '=' + v : null }.findAll { it }.join(';')
if (gamesId && !(gamesId ==~ /[0-9]+/)) throw new GradleException('Invalid Games app ID')

android {
    namespace 'io.github.yjw071218.sumdoku'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.yjw071218.sumdoku'
        minSdk 26
        targetSdk 36
        versionCode 158
        versionName '2.1.6'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            upload {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    flavorDimensions 'store'
    productFlavors {
        // GitHub Releases 배포판: 기존과 같은 서명·자체 업데이트 유지
        github {
            dimension 'store'
            buildConfigField 'boolean', 'GAMES_CONFIGURED', 'false'
            buildConfigField 'String', 'LEADERBOARDS', '""'
            signingConfig signingConfigs.debug
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
            buildConfigField 'String', 'DISTRIBUTION', '"github"'
            buildConfigField 'String', 'WEB_UPDATE_BASE_URL', '"https://raw.githubusercontent.com/yjw071218/sumdoku/main/app/src/main/assets/"'
            buildConfigField 'String', 'ADMOB_BANNER_ID', '""'
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '""'
            buildConfigField 'String', 'ADMOB_REWARDED_ID', '""'
        }
        // Google Play 배포판: 자체 업데이트 제거, 광고·광고 제거 구매 포함
        play {
            buildConfigField 'boolean', 'GAMES_CONFIGURED', gamesId ? 'true' : 'false'
            buildConfigField 'String', 'LEADERBOARDS', "\"${leaderboards}\""
            resValue 'string', 'game_services_project_id', gamesId ?: '0'
            dimension 'store'
            signingConfig signingConfigs.findByName('upload') ?: signingConfigs.debug
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
            buildConfigField 'String', 'DISTRIBUTION', '"play"'
            buildConfigField 'String', 'WEB_UPDATE_BASE_URL', '""'
            buildConfigField 'String', 'ADMOB_BANNER_ID', "\"${admobBannerId}\""
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', "\"${admobInterstitialId}\""
            buildConfigField 'String', 'ADMOB_REWARDED_ID', "\"${admobRewardedId}\""
            manifestPlaceholders = [admobAppId: admobAppId]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 서명은 배포판별로 지정합니다(GitHub판: 기존 서명 유지, 플레이판: 업로드 키).
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    // 플레이 release만 업로드 키로 서명합니다. 키가 없으면 빌드를 중단해 debug 서명 업로드를 막습니다.
    applicationVariants.all { variant ->
        if (variant.flavorName == 'play' && variant.buildType.name == 'release') {
            if (!keystorePropsFile.exists()) {
                variant.preBuildProvider.configure {
                    doFirst { throw new GradleException("플레이 업로드 키가 없습니다: ${keystorePropsFile}") }
                }
            }
        }
    }

    // 플레이판 전용 웹 자산: main/assets를 복사하면서 GitHub 관련 UI·문구·코드를 제거합니다.
    // 같은 이름의 파일은 flavor 자산이 main 자산을 덮어씁니다.
    sourceSets {
        play {
            assets.srcDirs += ["${buildDir}/generated/playAssets"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    playImplementation 'com.google.android.gms:play-services-games-v2:22.1.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    playImplementation 'com.android.billingclient:billing:9.1.0'
}

// ---------------------------------------------------------------------------
// 플레이판 자산 필터: GitHub 저장소 링크, GitHub Releases 업데이트 확인, 관련 번역 문구 제거
// 남은 GitHub 문자열이 있으면 빌드를 실패시킵니다(개인정보처리방침 호스팅 주소만 허용).
// ---------------------------------------------------------------------------
def playAssetsOut = file("${buildDir}/generated/playAssets")
def stripGithub = { String name, String t ->
    t = t.replace('\r\n', '\n')  // 체크아웃 줄바꿈(CRLF)과 무관하게 동작
    def rx = { String text, String pattern, String repl -> text.replaceAll(pattern, java.util.regex.Matcher.quoteReplacement(repl)) }
    switch (name) {
        case 'index.html':
            t = rx(t, /(?s)\s*<button id="btn-home-update".*?<\/button>/, '')
            t = rx(t, /(?s)\s*<footer class="home-footer">.*?<\/footer>/, '')
            t = rx(t, /(?m)^.*GitHub 저장소.*\R/, '')
            t = rx(t, /(?s)\s*<button id="btn-info-check-update".*?<\/button>/, '')
            t = rx(t, /(?s)\s*<button id="btn-info-github".*?<\/button>/, '')
            t = t.replace('게임 정보 &amp; 업데이트', '게임 정보').replace('게임 정보 & 업데이트', '게임 정보')
            break
        case 'app.js':
            t = rx(t, /(?m)^const GITHUB_REPO = .*\R/, '')
            t = rx(t, /(?s)    \/\/ Game Info & GitHub Buttons.*?(?=\n    \/\/ 메모 폰트)/, '')
            t = rx(t, /(?s)  async checkForUpdates\(manual = false\) \{.*?\n  \}\n/,
                "  async checkForUpdates(manual = false) {\n    if (manual) this.showToast('업데이트는 Google Play 스토어에서 받을 수 있습니다.');\n  }\n")
            break
        case 'i18n.js':
            t = rx(t, /(?m)^\s*home_update_desc:.*\R/, '')
            break
        case 'translations-extra.js':
            t = rx(t, /(?m)^.*GitHub.*\R/, '')
            break
        case 'dev-mode.js':
            // v2.1.5: 개발자 모드는 외부 배포판 전용입니다. Play판에는 코드 자체를 넣지 않습니다.
            t = '/* 개발자 모드: Play판에서는 제외됩니다. */'
            break
        case 'style.css':
            t = rx(t, /(?s)\.github-link \{.*?\}\s*/, '')
            break
    }
    t = t.replace('GitHub판', '외부 배포판').replace("이 없거나 'github')", '이 없거나 외부 배포판)')
    return t
}

def preparePlayAssets = tasks.register('preparePlayAssets') {
    def src = file('src/main/assets')
    inputs.dir(src)
    outputs.dir(playAssetsOut)
    doLast {
        project.delete(playAssetsOut)
        playAssetsOut.mkdirs()
        def leftovers = []
        src.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!(f.name ==~ /.*\.(js|html|css|json|txt|md)$/)) return
            String orig = f.getText('UTF-8')
            if (!orig.toLowerCase().contains('github')) return
            String t = stripGithub(f.name, orig)
            def rel = src.toPath().relativize(f.toPath()).toString()
            def out = new File(playAssetsOut, rel); out.parentFile.mkdirs(); out.setText(t, 'UTF-8')
            def check = t.replace('yjw071218.github.io/sumdoku/privacy', '')
            check.eachLine { line, n -> if (line.toLowerCase().contains('github')) leftovers << "${rel}:${n + 1}: ${line.trim().take(120)}" }
        }
        if (leftovers) throw new GradleException("플레이판 자산에 GitHub 문자열이 남았습니다: " + leftovers.join(" | "))
    }
}
tasks.matching { it.name ==~ /.*Play(Debug|Release).*/ && it.name != "preparePlayAssets" }.configureEach { dependsOn preparePlayAssets }
